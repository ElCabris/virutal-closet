name: virtual_closet
description: Your closet, curated. AI-powered virtual wardrobe for mobile.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  gap: ^3.0.1
  flutter_svg: ^2.0.10+1

  # Media
  image_picker: ^1.1.2
  image_cropper: ^7.1.0

  # On-device background removal (Android only, see BackgroundRemovalService)
  google_mlkit_subject_segmentation: ^0.1.0
  path_provider: ^2.1.5

  # Calendar
  table_calendar: ^3.1.2

  # Charts
  fl_chart: ^0.68.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  path: ^1.9.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  flutter_dotenv: ^5.1.0
  dio: ^5.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
