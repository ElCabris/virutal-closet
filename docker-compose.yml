version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crayoli_db
    environment:
      POSTGRES_DB: crayoli_dev
      POSTGRES_USER: crayoli
      POSTGRES_PASSWORD: crayoli
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crayoli -d crayoli_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: crayoli_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: crayoli_api
    volumes:
      - ./apps/api/src:/app/src
    environment:
      DATABASE_URL: postgresql+asyncpg://crayoli:crayoli@postgres:5432/crayoli_dev
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-in-production-32chars
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:3000"]'
      AI_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: crayoli_web
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/v1/ws
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
