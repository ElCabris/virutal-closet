[project]
name = "crayoli-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "redis[asyncio]>=5.0.4",
    "python-multipart>=0.0.9",
    "pillow>=10.3.0",
    "structlog>=24.2.0",
    "pgvector>=0.3.0",
    "boto3>=1.34.0",
    "anthropic>=0.28.0",
    "slowapi>=0.1.9",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
